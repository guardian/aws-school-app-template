name: Build and upload

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    # The first two permissions are needed to interact with GitHub's OIDC Token endpoint.
    # The second set of three permissions are needed to write test results back to GH
    permissions:
      id-token: write
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - run: npm ci
        name: Prepare for CDK infrastructure build
        working-directory: cdk
      - run: npm test
        name: Test CDK infrastructure integrity
        working-directory: cdk
      - run: npm run synth
        name: Build infrastructure definition from CDK
        working-directory: cdk

      - name: Setup JDK
        uses: guardian/setup-scala@v1

      - name: Build and test
        env:
          SBT_JUNIT_OUTPUT: ./junit-tests
          JAVA_OPTS: -Dsbt.log.noformat=true
        run: |
          sbt 'test;debian:packageBin'

      - uses: guardian/actions-riff-raff@v4
        with:
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          configPath: ./cdk/cdk.out/riff-raff.yaml
          projectName: Training::AWS App Template
          contentDirectories: |
            aws-school-app-template:
              - target/aws-school-app-template_1.0_all.deb
            cloudformation:
              - cdk/cdk.out/AwsSchoolAppTemplate-PROD.template.json
              - cdk/cdk.out/AwsSchoolAppTemplate-CODE.template.json

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()  #runs even if there is a test failure
        with:
          files: junit-tests/*.xml